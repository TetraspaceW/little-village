<!-- icon.svg — Petra, drawn the way the game draws her, saying 文A.
     The source for the rasterised icons in icons/; regenerate those from here.

     The villager is LG.actors.drawCharacter from js/npc.js at 7.4x: the same
     rounded body in her own #9d4edd, the same arms a shade darker sitting in
     the gaps her body's rounded corners leave, the same half-disc of hair
     riding two pixels proud of the head. Two things the game draws are left
     off. Her 🧒 role badge, because it is an emoji and an icon has no say in
     which font renders one, and her name label, because the bubble wants that
     corner and she is a stranger until you ask.

     文A is outlines rather than <text>: Noto Sans SC Bold, which is already
     what data.js asks for when a villager speaks Chinese, converted to paths
     so the file needs no font to render the same way twice. 文 and A are set
     on one baseline, the A up 15% so its cap height sits closer to 文's. -->
