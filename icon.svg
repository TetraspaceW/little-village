<!-- icon.svg — Petra, drawn the way the game draws her, saying 文A.

     The villager is LG.actors.drawCharacter from js/npc.js at 5x: the same
     rounded body in her own #9d4edd, the same detached arms a shade darker,
     the same half-disc of hair sitting slightly proud of the head. Two things
     the game draws are left off. Her 🧒 role badge, because an emoji in an
     icon is at the mercy of whatever font the launcher rasterises with, and
     her name label, because the bubble wants that spot and she is a stranger
     until you ask.

     文A is glyphs rather than text for the same reason: a home screen icon is
     rasterised by the OS, which may have no CJK font to hand. Type would be
     tofu; four strokes are four strokes anywhere. -->
